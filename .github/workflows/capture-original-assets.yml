name: Capture Original Temple Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-original-assets.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow requests
      - name: Capture current Circle Seven identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import io, requests
          from PIL import Image

          Path('public/brand').mkdir(parents=True, exist_ok=True)
          urls = [
              'https://www.google.com/s2/favicons?domain_url=https://moorishsciencetemple.org&sz=256',
              'https://www.google.com/s2/favicons?domain=moorishsciencetemple.org&sz=256',
          ]
          image = None
          chosen = None
          for url in urls:
              try:
                  r = requests.get(url, timeout=30, headers={'User-Agent':'Mozilla/5.0'})
                  r.raise_for_status()
                  candidate = Image.open(io.BytesIO(r.content)).convert('RGBA')
                  if candidate.width >= 32 and candidate.height >= 32:
                      image = candidate
                      chosen = url
                      break
              except Exception as exc:
                  print('FAVICON SOURCE SKIP', url, exc)
          if image is None:
              raise SystemExit('Could not retrieve cached favicon')

          image.save('public/brand/circle-seven-original.png', 'PNG', optimize=True)
          for path, size in [('app/icon.png', 512), ('app/apple-icon.png', 180)]:
              im = image.copy()
              im.thumbnail((size,size), Image.Resampling.LANCZOS)
              im.save(path, 'PNG', optimize=True)
          print('CAPTURED', chosen, image.size)
          PY
      - name: Commit captured identity
        run: |
          git config user.name "Temple Site Asset Capture"
          git config user.email "actions@users.noreply.github.com"
          git add app/icon.png app/apple-icon.png public/brand/circle-seven-original.png
          git commit -m "assets: preserve original Circle Seven identity" || exit 0
          git push
